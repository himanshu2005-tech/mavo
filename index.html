<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <title>Mavo</title>
    <style>
      html, body { margin: 0; background: #101010; color: #ededed; }
      .startup-screen { min-height: 100vh; display: grid; place-items: center; font: 14px system-ui, sans-serif; }
      .startup-card { max-width: 340px; padding: 32px; text-align: center; }
      .startup-card h1 { font-size: 24px; margin: 0 0 12px; }
      .startup-card p { color: #aaa; line-height: 1.6; }
      .startup-card button { border: 1px solid #555; border-radius: 9px; background: #262626; color: #fff; padding: 9px 16px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"><div class="startup-screen" id="mavo-startup"><div class="startup-card"><h1>Mavo</h1><p role="status">Starting Mavo…</p></div></div></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>

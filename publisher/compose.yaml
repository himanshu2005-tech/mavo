services:
  gateway:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    env_file: .env
    environment:
      MAVO_PUBLISHER_DATA_DIR: /data
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8741/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    environment:
      MAVO_CORE_HOST: ${MAVO_CORE_HOST:?Set MAVO_CORE_HOST to your public domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
volumes:
  gateway-data:
  caddy-data:
  caddy-config:

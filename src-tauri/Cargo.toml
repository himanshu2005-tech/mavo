[package]
name = "mavo"
version = "0.1.0"
description = "Mavo local-first personal AI"
authors = ["Mavo contributors"]
edition = "2021"

[lib]
name = "mavo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
